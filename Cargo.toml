[workspace]
resolver = "3"
# raft-rs is vendored as its own crates (crates/kermodes-raft/README.md).
members = [
    "crates/*",
    "crates/kermodes-raft/proto",
    "crates/kermodes-raft/harness",
    "crates/kermodes-raft/datadriven",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
arrow = { version = "60.1", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
pyo3-arrow = "0.21"
# visitor: the SQL binder rewrites expressions (dropping table qualifiers) before handing them to
# the expression parser.
sqlparser = { version = "0.64", default-features = false, features = ["std", "visitor"] }
kermodes-core = { path = "crates/kermodes-core" }
kermodes-control = { path = "crates/kermodes-control" }
kermodes-flight = { path = "crates/kermodes-flight" }
kermodes-gateway = { path = "crates/kermodes-gateway" }
kermodes-ingest = { path = "crates/kermodes-ingest" }
kermodes-lake = { path = "crates/kermodes-lake" }
kermodes-weir = { path = "crates/kermodes-weir" }

# Line tables are enough for backtraces; full debug info makes compiles, links, and target/ far
# larger.
[profile.dev]
debug = "line-tables-only"

# Dependencies (arrow's and parquet's kernels above all) optimised in every dev and test build:
# compiled once and cached, they make the engine's randomized oracle tests about four times
# faster, while the workspace's own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

# Editable Python builds (uv sync): optimised enough to use the engine, fast to rebuild.
[profile.dev-py]
inherits = "release"
lto = false
incremental = true
codegen-units = 256

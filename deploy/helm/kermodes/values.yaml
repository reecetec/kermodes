image:
  repository: ghcr.io/reecetec/kermodes
  # Defaults to the chart's appVersion: a chart release runs the image released with it.
  tag: ""
  pullPolicy: IfNotPresent

# The catalog's Postgres (architecture.md §8.2): a Secret holding its connection URI, such as a
# CloudNativePG cluster's `<cluster>-app` Secret. Empty: SQLite on weir's PVC, for one weir only.
catalog:
  secretName: ""
  secretKey: uri

# `kermodes control` (architecture.md §16.2): syncs projects from git and runs their resources.
# Needs `catalog`: it keeps its state in the catalog's Postgres.
control:
  enabled: false
  # One leads; the other serves the API and takes over within seconds (a Postgres lock).
  replicas: 2
  pollSeconds: 30
  # Each: name (its kermodes.toml's), url (any git host, HTTPS), branch (its mainline), and path
  # (its directory in the repository; empty for the root).
  projects: []
  # A Secret with `username` and `password` (a token) for the projects' repositories.
  git:
    secretName: ""
  # A Secret with `secret`, which signs pushes to POST /hooks/sync (X-Hub-Signature-256, as
  # GitHub, Gitea, and Forgejo send it); without one, the webhook is off.
  webhook:
    secretName: ""
    # Namespaces outside the controller's own that may call it: a git host in the cluster.
    namespaces: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Where merged history goes (architecture.md §8): with a url, the controller merges each table's
# past dates from weir into it, each date by a Job. The Secret holds AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY for that bucket alone.
history:
  url: ""  # s3://kermodes-history
  endpoint: ""  # the S3 endpoint inside the cluster, e.g. http://minio.minio.svc.cluster.local:9000
  secretName: ""

# Where builds put what they produce (architecture.md §10.6): apps' built files, an S3 bucket of
# its own. The Secret holds AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for that bucket alone;
# only the controller holds them, and build Jobs upload to presigned URLs.
artifacts:
  url: ""  # s3://kermodes-artifacts
  endpoint: ""
  secretName: ""

# How the controller builds projects' apps (apps/<name>/): Bun's image runs `bun install` and
# Vite's build. The Secret's keys become each build's environment: the tokens for private
# registries a project's .npmrc names.
builds:
  image: oven/bun:1.4
  secretName: ""

imagePullSecrets: []

weir:
  storage:
    size: 20Gi
    # Empty: the cluster's default StorageClass.
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # weir's Flight endpoint has no authentication yet: only pods in the release's namespace may
  # reach it.
  networkPolicy:
    enabled: true

ui:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # A Gateway API route to the web UI.
  httpRoute:
    enabled: false
    parentRefs: []
    hostnames: []

image:
  repository: git.rcolclough.com/rcolclough/kermodes
  # Defaults to the chart's appVersion: a chart release runs the image released with it.
  tag: ""
  pullPolicy: IfNotPresent

# The catalog's Postgres (architecture.md §8.2): a Secret holding its connection URI, such as a
# CloudNativePG cluster's `<cluster>-app` Secret. Empty: SQLite on weir's PVC, for one weir only.
catalog:
  secretName: ""
  secretKey: uri

# `kermodes control` (architecture.md §16.2): syncs projects from git and runs their resources.
# Needs `catalog`: it keeps its state in the catalog's Postgres.
control:
  enabled: false
  pollSeconds: 30
  # Each: name (its kermodes.toml's), url (any git host, HTTPS), branch (its mainline), and path
  # (its directory in the repository; empty for the root).
  projects: []
  # A Secret with `username` and `password` (a token) for the projects' repositories.
  git:
    secretName: ""
  # A Secret with `secret`, required on POST /hooks/sync; without one, the webhook is off.
  webhook:
    secretName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

imagePullSecrets: []

weir:
  storage:
    size: 20Gi
    # Empty: the cluster's default StorageClass.
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # weir's Flight endpoint has no authentication yet: only pods in the release's namespace may
  # reach it.
  networkPolicy:
    enabled: true

ui:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # A Gateway API route to the web UI.
  httpRoute:
    enabled: false
    parentRefs: []
    hostnames: []

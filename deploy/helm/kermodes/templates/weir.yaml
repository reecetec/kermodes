{{- $name := printf "%s-weir" (include "kermodes.fullname" .) -}}
{{- $selector := dict "root" . "component" "weir" -}}
{{- $replicas := int .Values.weir.replicas -}}
{{- if and (gt $replicas 1) (not .Values.catalog.secretName) -}}
{{- fail "weir.replicas above 1 needs catalog.secretName: a shard's replicas share their catalog in Postgres" -}}
{{- end -}}
# Headless: each replica answers at its own name, <pod>.<this service>, which clients and the other
# replicas use; a load-balanced address would hide which replica leads.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kermodes.labels" . | nindent 4 }}
    app.kubernetes.io/component: weir
spec:
  clusterIP: None
  # Replicas reach each other before they are ready.
  publishNotReadyAddresses: true
  selector:
    {{- include "kermodes.selectorLabels" $selector | nindent 4 }}
  ports:
    - name: flight
      port: 8731
      targetPort: flight
      appProtocol: kubernetes.io/h2c
{{- if gt $replicas 1 }}
---
# A drain takes one replica at a time: the others still make a majority, and writes go on.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "kermodes.labels" . | nindent 4 }}
    app.kubernetes.io/component: weir
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "kermodes.selectorLabels" $selector | nindent 6 }}
{{- end }}
---
# The shard's replicas (architecture.md §7.6), each with its own volume: one replica holds the
# shard alone; more replicate its log by Raft, so losing one loses no acknowledged write.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "kermodes.labels" . | nindent 4 }}
    app.kubernetes.io/component: weir
spec:
  serviceName: {{ $name }}
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "kermodes.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kermodes.labels" . | nindent 8 }}
        app.kubernetes.io/component: weir
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "kermodes.podSecurityContext" . | nindent 8 }}
      {{- if gt $replicas 1 }}
      # A node lost takes one replica at most.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "kermodes.selectorLabels" $selector | nindent 18 }}
      {{- end }}
      containers:
        - name: weir
          image: {{ include "kermodes.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if gt $replicas 1 }}
          # Pod n is replica n + 1: its ordinal ends its hostname.
          command: [sh, -c]
          args:
            - >-
              exec kermodes weir --data-dir /var/lib/kermodes --host 0.0.0.0 --port 8731
              --replica $(( ${HOSTNAME##*-} + 1 )) --peers {{ include "kermodes.weirPeers" . }}
          {{- else }}
          args: [weir, --data-dir, /var/lib/kermodes, --host, 0.0.0.0, --port, "8731"]
          {{- end }}
          {{- if or .Values.catalog.secretName .Values.lake.url }}
          env:
            {{- with .Values.catalog.secretName }}
            # The catalog in Postgres, shared by every weir (§8.2); without it, SQLite on the PVC.
            - name: KERMODES_CATALOG
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.catalog.secretKey }}
            {{- end }}
            {{- if .Values.lake.url }}
            # Weir vends history files to readers, who hold no lake keys (architecture.md §8.4).
            - name: KERMODES_LAKE
              value: {{ .Values.lake.url | quote }}
            - name: AWS_ENDPOINT
              value: {{ .Values.lake.endpoint | quote }}
            - name: AWS_ALLOW_HTTP
              value: {{ hasPrefix "http://" .Values.lake.endpoint | quote }}
            - name: AWS_REGION
              value: us-east-1
            {{- end }}
          {{- end }}
          {{- if and .Values.lake.url .Values.lake.secretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.lake.secretName }}
          {{- end }}
          ports:
            - name: flight
              containerPort: 8731
          # Ready once caught up with its shard (gRPC health), so a rollout or drain takes the
          # next replica down only then; alive while it catches up, however long that takes.
          readinessProbe:
            grpc:
              port: 8731
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: flight
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.weir.resources | nindent 12 }}
          securityContext:
            {{- include "kermodes.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kermodes
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.weir.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.weir.storage.size }}
{{- if .Values.weir.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "kermodes.labels" . | nindent 4 }}
    app.kubernetes.io/component: weir
spec:
  podSelector:
    matchLabels:
      {{- include "kermodes.selectorLabels" $selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8731
{{- end }}

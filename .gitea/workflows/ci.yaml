name: CI

on:
  workflow_dispatch:
  pull_request:
  # Every green push to master is a release (the release job below).
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

# Every Rust compile goes through sccache, shared by both jobs and every runner in the
# kermodes-sccache bucket on rustfs; ci/Dockerfile holds the toolchain.
env:
  RUSTC_WRAPPER: sccache
  # sccache cannot cache incremental builds.
  CARGO_INCREMENTAL: "0"
  SCCACHE_BUCKET: kermodes-sccache
  SCCACHE_ENDPOINT: http://rustfs-svc.rustfs.svc.cluster.local:9000
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: "false"
  # Unreachable storage builds uncached rather than failing.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

jobs:
  # The Rust half and the Python and web half are independent: they run side by side.
  rust:
    runs-on: arc
    container:
      image: git.rcolclough.com/rcolclough/kermodes-ci:rust1.98.1-bun1.4.2-sccache0.19.0
    env:
      # The Postgres catalog's tests (crates/kermodes-weir/tests/catalog.rs) run against it.
      KERMODES_TEST_POSTGRES: postgres://postgres:kermodes@127.0.0.1:5432/postgres

    steps:
      # In the job's own container: the runner puts jobs on Docker's default bridge network, where
      # a service container's name does not resolve.
      - name: Start Postgres
        run: |
          pg_ctlcluster 17 main start
          su postgres -c "psql -qc \"ALTER USER postgres PASSWORD 'kermodes'\""

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          set-safe-directory: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Dependencies (arrow's kernels above all) optimised: the engine's oracle tests run in half
      # the time, and the compile cache keeps them built.
      - name: Run Rust tests
        run: cargo test --workspace --locked --config 'profile.dev.package."*".opt-level=3'

      - name: Check for a second arrow-rs major
        run: |
          if cargo tree --workspace --locked --duplicates --edges normal | grep -E '^arrow'; then
            echo "arrow-rs crates appear at more than one version" >&2
            exit 1
          fi

      - name: Compile cache
        if: always()
        run: sccache --show-stats

  python:
    runs-on: arc
    container:
      image: git.rcolclough.com/rcolclough/kermodes-ci:rust1.98.1-bun1.4.2-sccache0.19.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          set-safe-directory: true

      - name: Build the Python package
        run: uv sync --locked

      - name: Check the table viewer (web/)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build

      - name: Run Ruff
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check

      - name: Run ty
        run: uv run --no-sync ty check

      - name: Run Python tests
        run: uv run --no-sync pytest

      - name: Compile cache
        if: always()
        run: sccache --show-stats

  # The packages apps build on (@kermodes/client, react, theme), at the release's version, to
  # Gitea's npm registry: an app pins the version of the platform it was built against.
  packages:
    needs: [rust, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: arc
    container:
      image: git.rcolclough.com/rcolclough/kermodes-ci:rust1.98.1-bun1.4.2-sccache0.19.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          set-safe-directory: true

      - name: Publish the web packages
        working-directory: web
        env:
          NPM_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun publish.ts "0.4.${{ github.run_number }}" https://git.rcolclough.com/api/packages/rcolclough/npm/

  # Every green push to master is released: the build's version is 0.4.<run number>, stamped into
  # this checkout only (the repository says 0.0.0). It builds the one image and its chart, once;
  # Kargo promotes them from the registry.
  release:
    needs: [rust, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: arc
    container:
      image: git.rcolclough.com/rcolclough/buildah-ci:stable-node20
    env:
      REGISTRY: git.rcolclough.com
      REGISTRY_USER: reecec
      IMAGE: git.rcolclough.com/rcolclough/kermodes
      CHARTS: oci://git.rcolclough.com/rcolclough/charts
      HELM_VERSION: v4.3.0
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
      XDG_RUNTIME_DIR: /tmp/containers-run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          set-safe-directory: true

      - name: Stamp the version
        id: version
        run: |
          VERSION="0.4.${{ github.run_number }}"
          sed -i "s/^version = \"0.0.0\"$/version = \"$VERSION\"/" Cargo.toml pyproject.toml
          grep -qx "version = \"$VERSION\"" Cargo.toml
          grep -qx "version = \"$VERSION\"" pyproject.toml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "${{ secrets.REGISTRY_TOKEN }}" | buildah login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build and push the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          buildah build \
            --arch amd64 \
            --secret id=sccache_id,env=AWS_ACCESS_KEY_ID \
            --secret id=sccache_key,env=AWS_SECRET_ACCESS_KEY \
            --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_REVISION="$GITHUB_SHA" \
            --build-arg IMAGE_SOURCE="https://git.rcolclough.com/${GITHUB_REPOSITORY}" \
            --build-arg IMAGE_VERSION="$VERSION" \
            --target runtime \
            --tag "$IMAGE:$VERSION" \
            .
          buildah push "$IMAGE:$VERSION"

      - name: Push the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          HELM=/tmp/linux-amd64/helm
          echo "${{ secrets.REGISTRY_TOKEN }}" | $HELM registry login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          $HELM package deploy/helm/kermodes --version "$VERSION" --app-version "$VERSION" --destination /tmp/chart
          $HELM push "/tmp/chart/kermodes-$VERSION.tgz" "$CHARTS"

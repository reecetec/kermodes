name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    # A release: v<version>, where every version in the repository says <version>.
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: arc
    container:
      image: ghcr.io/astral-sh/uv:0.13.7-python3.14-trixie-slim
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      UV_LINK_MODE: copy
      # The Postgres catalog's tests (crates/kermodes-weir/tests/catalog.rs) run against it.
      KERMODES_TEST_POSTGRES: postgres://postgres:kermodes@127.0.0.1:5432/postgres

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git nodejs postgresql unzip

      # In the job's own container: the runner puts jobs on Docker's default bridge network, where
      # a service container's name does not resolve.
      - name: Start Postgres
        run: |
          pg_ctlcluster 17 main start
          su postgres -c "psql -qc \"ALTER USER postgres PASSWORD 'kermodes'\""

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          set-safe-directory: true

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --profile minimal --default-toolchain 1.98.1 --component clippy,rustfmt
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check for a second arrow-rs major
        run: |
          if cargo tree --workspace --locked --duplicates --edges normal | grep -E '^arrow'; then
            echo "arrow-rs crates appear at more than one version" >&2
            exit 1
          fi

      - name: Build the Python package
        run: uv sync --locked

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Check the table viewer (web/)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build

      - name: Run Ruff
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check

      - name: Run ty
        run: uv run --no-sync ty check

      - name: Run Python tests
        run: uv run --no-sync pytest

  # Builds the release's one image and its chart, once; Kargo promotes them from the registry.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: arc
    container:
      image: git.rcolclough.com/rcolclough/buildah-ci:stable-node20
    env:
      REGISTRY: git.rcolclough.com
      REGISTRY_USER: reecec
      IMAGE: git.rcolclough.com/rcolclough/kermodes
      CHARTS: oci://git.rcolclough.com/rcolclough/charts
      HELM_VERSION: v4.3.0
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
      XDG_RUNTIME_DIR: /tmp/containers-run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          set-safe-directory: true

      - name: Check the tag matches every version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$VERSION\"" pyproject.toml
          grep -qx "version = \"$VERSION\"" Cargo.toml
          grep -qx "version: $VERSION" deploy/helm/kermodes/Chart.yaml
          grep -qx "appVersion: \"$VERSION\"" deploy/helm/kermodes/Chart.yaml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "${{ secrets.REGISTRY_TOKEN }}" | buildah login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build and push the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          buildah build \
            --arch amd64 \
            --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_REVISION="$GITHUB_SHA" \
            --build-arg IMAGE_SOURCE="https://git.rcolclough.com/${GITHUB_REPOSITORY}" \
            --build-arg IMAGE_VERSION="$VERSION" \
            --target runtime \
            --tag "$IMAGE:$VERSION" \
            .
          buildah push "$IMAGE:$VERSION"

      - name: Push the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          HELM=/tmp/linux-amd64/helm
          echo "${{ secrets.REGISTRY_TOKEN }}" | $HELM registry login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          $HELM package deploy/helm/kermodes --destination /tmp/chart
          $HELM push "/tmp/chart/kermodes-$VERSION.tgz" "$CHARTS"

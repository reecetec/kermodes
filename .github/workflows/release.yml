name: Release

# Everything Kermodes publishes, from candidates CI built (architecture.md §16.1). One workflow,
# because npm and PyPI trust one workflow file per package for publishing without tokens:
#
# - after each green CI run on master: the candidate's npm packages under the `dev` tag, so apps
#   can pin a build before it is released;
# - on a tag vX.Y.Z: the tagged commit's candidate, released as it is. Its wheels, npm tarballs,
#   and chart are relabelled X.Y.Z (ci/relabel.py, which fails if anything but version metadata
#   would change), its image gains the tags X.Y.Z and latest, and the wheels go to PyPI.
#
# A release touches four registries one after another; one that fails part way is finished by
# running this workflow by hand for its tag (with this file as it is on master). Every step can
# run again: the image tags and the relabelled chart are the same, and what npm, PyPI, and the
# GitHub release already have is skipped. A release tag never moves.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to publish again, finishing a release that failed
        required: true

permissions:
  contents: read

jobs:
  dev:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: candidate
          path: candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # npm 11.5 and later publish with the workflow's identity (trusted publishing).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the npm packages under dev
        run: |
          VERSION=$(cat candidate/version)
          # Dependencies first; a rerun skips what it already published.
          for name in client grid react theme; do
            if [ -z "$(npm view "@kermodes/$name@$VERSION" version 2>/dev/null)" ]; then
              npm publish "./candidate/npm/kermodes-$name-$VERSION.tgz" --tag dev --access public
            fi
          done

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}
      CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Which release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a release tag vX.Y.Z" >&2
            exit 1
          fi
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          { echo "TAG=$TAG"; echo "VERSION=${TAG#v}"; echo "SHA=$SHA"; } >> "$GITHUB_ENV"

      - name: Find the tagged commit's candidate
        id: candidate
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN" ]; then
            echo "$TAG is on $SHA, which has no green CI run on master to release" >&2
            exit 1
          fi
          # The candidate's own artifacts only: the run holds others (a docker build record).
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name candidate --dir candidate/candidate
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --pattern 'wheels-*' --dir candidate
          ls -R candidate
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "version=$(cat candidate/candidate/version)" >> "$GITHUB_OUTPUT"

      - name: Relabel the candidate's files
        run: python3 ci/relabel.py "$VERSION" candidate release

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Tag the candidate's image
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE:${{ steps.candidate.outputs.version }}"

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Push the chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "release/kermodes-$VERSION.tgz" "$CHARTS"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the npm packages
        run: |
          # Dependencies first; a rerun skips what it already published. The ./ keeps npm from
          # reading release/<file> as a GitHub repository.
          for name in client grid react theme; do
            if [ -z "$(npm view "@kermodes/$name@$VERSION" version 2>/dev/null)" ]; then
              npm publish "./release/kermodes-$name-$VERSION.tgz" --tag latest --access public
            fi
          done

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG's GitHub release exists"
          else
            gh release create "$TAG" release/*.whl --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" \
              --notes "Candidate ${{ steps.candidate.outputs.version }}, built and checked by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${{ steps.candidate.outputs.run }}."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pypi
          path: release/*.whl
          if-no-files-found: error

  pypi:
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A rerun of a release that reached PyPI.
          skip-existing: true

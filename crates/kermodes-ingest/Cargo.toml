[package]
name = "kermodes-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arrow = { workspace = true, features = ["json"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
kermodes-weir.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"

[package]
name = "ursid-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
ursid-core.workspace = true

[dev-dependencies]
arrow.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29"

[package]
name = "kermodes-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
# Exercised through the Python test suite; a Rust test binary would need libpython at link time.
test = false
doctest = false

[dependencies]
arrow.workspace = true
mimalloc.workspace = true
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
pyo3.workspace = true
pyo3-arrow.workspace = true
kermodes-core.workspace = true
kermodes-flight.workspace = true
kermodes-gateway.workspace = true
kermodes-weir.workspace = true

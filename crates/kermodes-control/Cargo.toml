[package]
name = "kermodes-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
arrow.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Collecting the artifacts store's listing, a stream.
futures-util = { version = "0.3.34", default-features = false }
# HMAC for signed webhooks; already built for kube's TLS.
ring = "0.17.14"
kermodes-flight.workspace = true
# The Deployments tab's lake row: a probe of the history store.
kermodes-lake.workspace = true
kermodes-weir.workspace = true
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "config", "aws-lc-rs", "rustls-tls"] }
# Build outputs (apps, later environments) in their own bucket: presigned uploads from build
# Jobs, and the UI's app files read back. The lake's version, so one is built.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
# A built app arrives as a tar of its files.
tar = { version = "0.4", default-features = false }
# Commit statuses from the git host, for projects deployed only once their checks pass; already
# built, with rustls, for object_store's S3 client.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"

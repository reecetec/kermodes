[package]
name = "kermodes-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
arrow.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# HMAC for signed webhooks; already built for kube's TLS.
ring = "0.17.14"
kermodes-flight.workspace = true
kermodes-weir.workspace = true
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "config", "ring", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"

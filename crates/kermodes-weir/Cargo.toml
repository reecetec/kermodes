[package]
name = "kermodes-weir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arrow = { workspace = true, features = ["ipc"] }
bytes = "1.11"
crc32fast = "1.5"
nix = { version = "0.31", default-features = false, features = ["fs"] }
kermodes-core.workspace = true
postgres = { version = "0.19.14", default-features = false }
raft = { package = "kermodes-raft", path = "../kermodes-raft" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1.0.154"

[dev-dependencies]
postgres = { version = "0.19.14", default-features = false }

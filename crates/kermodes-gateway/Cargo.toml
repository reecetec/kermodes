[package]
name = "kermodes-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
# Apps' dev servers are proxied WebSockets and all (Vite's hot reload); axum's own `ws` uses it.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
arrow.workspace = true
kermodes-core.workspace = true

[dev-dependencies]
arrow.workspace = true

[project]
name = "kermodes"
version = "0.3.4"
description = "Live and historical tables on Arrow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kermodes = "kermodes.cli:main"

[project.optional-dependencies]
# The table viewer in notebooks (kermodes.notebook); without it tables show as HTML.
notebook = ["anywidget>=0.9"]

[dependency-groups]
dev = [
    "anywidget>=0.9",
    "ipykernel>=7.4.0",
    "pyarrow",
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/kermodes-py/Cargo.toml"
module-name = "kermodes._native"
python-source = "python"
editable-profile = "dev-py"

[tool.uv]
# uv rebuilds the extension only when one of these changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
# Comparison scripts run against other engines in their own environments.
exclude = ["bench"]
